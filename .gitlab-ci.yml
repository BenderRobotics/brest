image:
  name: python:3.8
  pull_policy: always

stages:
  - toolchain
  - build
  - test
  - docs
  - preview
  - deploy

variables:
  IMAGE_TAG: '${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}'
  PREVIEW_URL: '${CI_COMMIT_REF_SLUG}-${DOC_REVIEW_URL}'
  DOCKER_ENV: '-e GITLAB_SERVER=${CI_SERVER_HOST} -e GITLAB_TOKEN=${GITLAB_TOKEN}'
  ROUTER_ID: '${CI_PROJECT_ID}-${CI_PROJECT_NAME}-${CI_COMMIT_REF_SLUG}'

.rule-do-not-deploy-doc:
  - if: $CI_COMMIT_TAG =~ /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)?$/
    when: never

.rule-release:
  - if: $CI_COMMIT_TAG =~ /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)?$/


build-wheel:
  stage: build
  tags:
    - docker
  before_script:
    - pip install build
  script:
    - python -m build --sdist --wheel .
  artifacts:
    paths:
      - "dist/brest-*.*"
    expire_in: 1 week

publish-toolchain:
  image: docker
  stage: toolchain
  services:
    - docker:dind
  before_script:
    - echo $CI_JOB_TOKEN | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - cd docker
    - docker build --pull -t "$CI_REGISTRY_IMAGE/toolchain:$CI_COMMIT_TAG" .
    - docker push "$CI_REGISTRY_IMAGE/toolchain:$CI_COMMIT_TAG"
    - docker build --pull -t "$CI_REGISTRY_IMAGE/toolchain:latest" .
    - docker push "$CI_REGISTRY_IMAGE/toolchain:latest"
  tags:
    - docker
  only:
    - web

.code-quality:
  stage: test
  tags:
    - docker
  image: docker
  allow_failure: true
  variables:
    CI_DEBUG_TRACE: "false"
    REPORT_FORMAT: "json"
  before_script:
    - echo "Skipping 'before_script' part"
  script:
    - echo $REPORT_FORMAT
    - CONTAINER_ID=$(docker ps -q -f "label=com.gitlab.gitlab-runner.job.id=${CI_JOB_ID}")
    - VOLUME_PATH=$(docker inspect $CONTAINER_ID --format '{{ range .Mounts }}{{ if eq .Destination "/builds" }}{{ .Source }}{{ end }}{{ end }}')
    - VOLUME_CODE_PATH="${VOLUME_PATH}/${CI_PROJECT_DIR#$CI_BUILDS_DIR}"
    - docker run
        --rm
        --env SOURCE_CODE=$VOLUME_CODE_PATH
        --env REPORT_FORMAT=$REPORT_FORMAT
        --env CODECLIMATE_DEV=1
        --volume /var/run/docker.sock:/var/run/docker.sock
        --volume $VOLUME_CODE_PATH:/code
        registry.gitlab.com/gitlab-org/ci-cd/codequality:latest /code
  artifacts:
    expire_in: 1 week
  dependencies: []

code-quality-json:
  extends: .code-quality
  artifacts:
    reports:
      codequality: gl-code-quality-report.json
    paths: [gl-code-quality-report.json]
    expire_in: 1 month
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: never
    - when: always

code-quality-html:
  extends: .code-quality
  variables:
    REPORT_FORMAT: "html"
  artifacts:
    paths: [gl-code-quality-report.html]

# generate dynamic child pipeline
generate-child-pipeline:
  stage: build
  image: python:3.8
  tags:
    - docker
  before_script:
    - pip install ruamel.yaml
  script:
    - python tools/child_pipeline_generator.py
  artifacts:
    paths:
      - child-pipeline.yml

# executes pipelines
unit-tests:
  stage: test
  trigger:
    include:
      - artifact: child-pipeline.yml
        job: generate-child-pipeline
    strategy: depend
  variables:
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID

# create artifacts
unit-tests-artifacts:
  stage: test
  needs: ["unit-tests"]
  tags:
    - docker
  before_script:
    - pip install python-gitlab
  script:
    - python tools/create_tests_artifacts.py
  when: always
  artifacts:
    when: always
    paths:
      - log
    expire_in: 1 day

build-docs-for-deploy:
  stage: docs
  needs: ["build-wheel"]
  image: $CI_REGISTRY_IMAGE/toolchain
  tags:
    - docker-hp
  variables:
    INCLUDE_CURRENT_BRANCH: '0'
  before_script:
    # Change pending to be added to toolchain, cython needed by hidapi
    - pip install --upgrade pip setuptools Cython==0.29.36
    - pip install -i https://pypi.benderrobotics.com dist/brest-*.whl
  script:
    - apk add git
    - pip install brest[docs]
    - pip install --no-cache-dir cm/sphinx-versions/sphinx-versions-1.1.3.post4.tar.gz
    - cd docs
    - make html-versioned
    - cd ../tools
    - python docs_invert_titles.py
  artifacts:
    paths:
      - "docs/_build/html/*"
    expire_in: 1 week
  dependencies:
    - build-wheel
  rules:
    - when: never
    - !reference [.rule-release]

build-docs-for-review:
  extends: build-docs-for-deploy
  variables:
    INCLUDE_CURRENT_BRANCH: '1'
  rules:
    - when: never
    - !reference [.rule-do-not-deploy-doc]
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: never
    - when: always

build-docs-docker:
  stage: preview
  needs:
    - job: "build-docs-for-review"
      optional: true
  image: docker
  allow_failure: true
  tags:
    - docker-hp
  script:
    - docker build --pull -t $IMAGE_TAG -f docs/docker/Dockerfile docs/
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $IMAGE_TAG
  rules:
    - when: never
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

.preview:
  stage: preview
  needs:
    - job: "build-docs-docker"
      optional: true
  tags:
    - web
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "devel"
      when: never
    - if: $CI_COMMIT_BRANCH
      when: on_success

preview:
  extends: .preview
  script:
    - docker stop $PREVIEW_URL || true
    - docker rm $PREVIEW_URL || true
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker run -d --name $PREVIEW_URL --network="web" -l traefik.enable=true -l traefik.http.routers.$ROUTER_ID.rule=Host\(\`$PREVIEW_URL\`\) -l traefik.http.routers.$ROUTER_ID.tls=true --pull=always $DOCKER_ENV $IMAGE_TAG
  environment:
    name: preview/$CI_COMMIT_REF_NAME
    url: https://${CI_COMMIT_REF_SLUG}-${DOC_REVIEW_URL}
    on_stop: stop_preview
  rules:
    - when: never

stop_preview:
  extends: .preview
  script:
    - docker stop $PREVIEW_URL
    - docker rm $PREVIEW_URL
  variables:
    GIT_STRATEGY: none
  environment:
    name: preview/$CI_COMMIT_REF_NAME
    action: stop
  rules:
    - when: never

staging:
  stage: preview
  needs:
    - job: "build-docs-docker"
      optional: true
  script:
    - docker stop $DOC_STAGING_URL || true
    - docker rm $DOC_STAGING_URL || true
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker run -d --name $DOC_STAGING_URL --network="web" -l traefik.enable=true -l traefik.http.routers.$ROUTER_ID.rule=Host\(\`$DOC_STAGING_URL\`\) -l traefik.http.routers.$ROUTER_ID.tls=true --pull=always $DOCKER_ENV $IMAGE_TAG
  environment:
    name: staging
    url: https://${DOC_STAGING_URL}
  only:
    - never
  except:
    - tags
  tags:
    - web

.deploy-wheel:
  stage: deploy
  needs: ["build-wheel"]
  rules:
    - !reference [.rule-release]

deploy-wheel-br:
  extends: .deploy-wheel
  image: ${CI_REGISTRY}/br/toolchains/release:0.1
  before_script:
    - echo "$PYPI_KEY" | tr -d '\r' > ./ssh_key
    - chmod 600 ./ssh_key
  script:
    - |
      sftp -i ./ssh_key -oStrictHostKeyChecking=no $PYPI_USER@$PYPI_HOST:/brest/ << EOF
        put dist/*
        quit
      EOF

deploy-wheel-pypi:
  extends: .deploy-wheel
  image: python:3.9
  before_script:
    - pip install twine
  script:
    - twine check --strict dist/*
    - twine upload --verbose --repository-url $PYPI_INDEX dist/*

deploy-docs:
  stage: deploy
  needs:
    - job: "build-docs-for-deploy"
      optional: true
  tags:
    - docker
  image: ${CI_REGISTRY}/br/toolchains/release:0.1
  allow_failure: true
  before_script:
    - echo "$DOCS_KEY" | tr -d '\r' > ./ssh_key
    - chmod 600 ./ssh_key
  script:
    - |
      sftp -i ./ssh_key -oStrictHostKeyChecking=no $DOCS_USER@$DOCS_HOST:/brest/ << EOF
        put -R docs/_build/html/*
        quit
      EOF
  dependencies:
    - build-docs-for-deploy
  rules:
    - when: never
    - !reference [.rule-release]
