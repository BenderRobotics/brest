image: brest:latest

stages:
  - build
  - test
  - docs
  - deploy

before_script:
  - pip install dist/brest-*.whl

build-wheel:
  stage: build
  tags:
    - docker
  before_script:
    - echo
  script:
    - make
  artifacts:
    paths:
      - "dist/*.whl"
    expire_in: 1 week

.code-quality:
  stage: test
  tags:
    - docker
  image: docker:stable
  allow_failure: true
  variables:
    CI_DEBUG_TRACE: "false"
    REPORT_FORMAT: "json"
  before_script:
    - echo "Skipping 'before_script' part"
  script:
    - echo $REPORT_FORMAT
    - CONTAINER_ID=$(docker ps -q -f "label=com.gitlab.gitlab-runner.job.id=${CI_JOB_ID}")
    - VOLUME_PATH=$(docker inspect $CONTAINER_ID --format '{{ range .Mounts }}{{ if eq .Destination "/builds" }}{{ .Source }}{{ end }}{{ end }}')
    - VOLUME_CODE_PATH="${VOLUME_PATH}/${CI_PROJECT_DIR#$CI_BUILDS_DIR}"
    - docker run
        --rm
        --env SOURCE_CODE=$VOLUME_CODE_PATH
        --env REPORT_FORMAT=$REPORT_FORMAT
        --env CODECLIMATE_DEV=1
        --volume /var/run/docker.sock:/var/run/docker.sock
        --volume $VOLUME_CODE_PATH:/code
        registry.gitlab.com/gitlab-org/ci-cd/codequality:latest /code
  artifacts:
    expire_in: 1 week
  dependencies: []

code-quality-json:
  extends: .code-quality
  artifacts:
    reports:
      codequality: gl-code-quality-report.json
    paths: [gl-code-quality-report.json]

code-quality-html:
  extends: .code-quality
  variables:
    REPORT_FORMAT: "html"
  artifacts:
    paths: [gl-code-quality-report.html]

test-unit:
  stage: test
  tags:
    - docker
  script:
    - python tests/test_root_logger.py
    - python tests/test_colorful_output.py
  dependencies:
    - build-wheel

build-docs:
  stage: docs
  tags:
    - docker
  script:
    - pip install brest[docs]
    - cd docs
    - make html
  artifacts:
    paths:
      - "docs/_build/html/*"
    expire_in: 1 week
  dependencies:
    - build-wheel

deploy-wheel:
  stage: deploy
  tags:
    - docker
  script:
    - python tests/test_version.py
    - python setup.py sdist
    - cp -r dist/* /opt/brest/bin
  dependencies:
    - build-wheel
  only:
    - tags

deploy-docs:
  stage: deploy
  tags:
    - docker
  script:
    - python tests/test_version.py
    - cp -r docs/_build/html/* /opt/brest/docs
  dependencies:
    - build-wheel
    - build-docs
  only:
    - tags
